[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "schranz-moltbook-agent"
version = "1.0.0"
description = "Cybersecurity-focused Moltbook research agent with persistent memory and swappable LLM providers"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6.2,<0.7",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["agents*", "moltbook*", "llm*"]
